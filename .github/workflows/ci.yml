name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint the specs of this repository
        run: node bin/index.js lint

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Install dependencies
        run: npm ci

      - name: Pack, install the tarball in a scratch project and run the CLI
        run: |
          npm pack --silent
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y > /dev/null
          npm install --silent "$GITHUB_WORKSPACE"/speckit-ai-*.tgz
          BIN="$SMOKE/node_modules/.bin/speckit-ai"
          "$BIN" --help
          mkdir project
          cd project
          npm init -y > /dev/null
          git init -q
          "$BIN"
          test -f .agents/AGENTS.md
          test -f specs/_workflow.md
          test -f .agents/skills/spec-review/SKILL.md
          "$BIN" start "Smoke test"
          "$BIN" lint
